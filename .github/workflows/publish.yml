name: Publish to NuGet

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/*.sln
            **/*.slnx
            NuGet.config

      - name: Restore
        run: dotnet restore ./EpochSim.slnx

      - name: Pack
        run: |
          dotnet pack src/EpochSim.Kernel    -c Release --no-restore
          dotnet pack src/EpochSim           -c Release --no-restore
          dotnet pack src/EpochSim.Execution -c Release --no-restore
          dotnet pack src/EpochSim.Serialization -c Release --no-restore
          dotnet pack src/EpochSim.Observability -c Release --no-restore
          dotnet pack src/EpochSim.Cli       -c Release --no-restore
          dotnet pack src/EpochSim.All       -c Release --no-restore

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v3

      - name: Push all packages
        run: |
          for pkg in src/*/bin/Release/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
