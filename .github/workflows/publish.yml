name: Publish to NuGet

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/*.sln
            **/*.slnx
            NuGet.config

      - name: Restore
        run: dotnet restore ./EpochSim.slnx

      - name: Pack
        run: |
          dotnet pack src/EpochSim.Kernel    -c Release --no-restore
          dotnet pack src/EpochSim           -c Release --no-restore
          dotnet pack src/EpochSim.Execution -c Release --no-restore
          dotnet pack src/EpochSim.Serialization -c Release --no-restore
          dotnet pack src/EpochSim.Observability -c Release --no-restore
          dotnet pack src/EpochSim.Cli       -c Release --no-restore
          dotnet pack src/EpochSim.All       -c Release --no-restore

      - name: Get NuGet API key via OIDC
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const oidcToken = await core.getIDToken('api.nuget.org');
            const resp = await fetch('https://www.nuget.org/api/v1/authentication/authenticate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: oidcToken })
            });
            if (!resp.ok) throw new Error(`Token exchange failed: ${resp.status} ${await resp.text()}`);
            const { apiKey } = await resp.json();
            core.setSecret(apiKey);
            core.setOutput('token', apiKey);

      - name: Push all packages
        run: |
          for pkg in src/*/bin/Release/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.oidc.outputs.token }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
