version: 2

updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      test-tooling:
        patterns: ['xunit*', 'MSTest*', 'NUnit*', 'Microsoft.NET.Test.Sdk', 'coverlet*']
      roslyn:
        patterns: ['Microsoft.CodeAnalysis*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: EpochSim*
